/* Construct ECharts Data */

const nodesSet = new Set();

    links.push({source: l.id, target: l.emo, value: l.v});
    links.push({source: l.emo, target: l.place, value: l.v});
    nodesSet.add(l.id);
    nodesSet.add(l.emo);
    nodesSet.add(l.place);
});

const colorMap = {
    'Official':'#5470c6','Student Abroad':'#91cc75','Traveler':'#fac858','Industrialist':'#ee6666',

            fontSize: 11,
            formatter: '{b} ({c})'   // ← Node label with data

    }]
};
myChart.setOption(option);
window.addEventListener('resize', () => myChart.resize());
